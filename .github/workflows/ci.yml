name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - run: go test ./...
      - if: runner.os == 'Linux'
        run: go test -race ./...
      - run: go vet ./...
      - run: go build -trimpath ./cmd/knotroute ./cmd/knotroute-beacon ./cmd/knotroute-sidecar
      - if: runner.os == 'Windows'
        run: go build -trimpath -ldflags="-H=windowsgui" ./cmd/knotroute-desktop ./cmd/knotroute-service
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix web
      - run: npm --prefix web run build
      - run: git diff --exit-code internal/overlay/assets
