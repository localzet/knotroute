name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
      - run: go test ./...
      - if: runner.os == 'Linux'
        run: go test -race ./...
      - run: go vet ./...
      - run: go build -trimpath ./cmd/knotroute ./cmd/knotroute-beacon ./cmd/knotroute-sidecar ./cmd/knotroute-control ./cmd/knotroute-agent
      - if: runner.os == 'Windows'
        run: go build -trimpath -ldflags="-H=windowsgui" ./cmd/knotroute-desktop ./cmd/knotroute-service
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install --prefix web
      - run: npm --prefix web run build
      - run: node --check internal/ops/controlweb/app.js
      - run: git diff --exit-code internal/overlay/assets

  integration-stress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
      - name: Repeat critical integration scenarios
        run: |
          go test ./internal/overlay -run '^(TestOverlayAutoPeersThroughBeacon|TestHTTPProxyResolvesKnotDomainAcrossRelay|TestSOCKS5ResolvesServiceKnotDomainAcrossRelay|TestHTTPProxyOpensLocalPublishedService|TestPublishedServiceThroughDirectoryIntroductionAndRendezvous)$' -count=3 -timeout=150s
          go test ./cmd/knotroute-control -run '^TestAgentLifecycleEnrollHeartbeatJobResult$' -count=10 -timeout=60s
          go test ./internal/clientruntime -run '^TestMessengerAcrossTwoRuntimes$' -count=10 -timeout=120s
          go test ./internal/transport -run '^TestSOCKS5Transport$' -count=20 -timeout=60s

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Build production documentation site
        working-directory: docs-site
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run build
