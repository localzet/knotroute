name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - run: go test -race ./...
      - name: Build archives
        run: VERSION="${GITHUB_REF_NAME#v}" ./scripts/build-release.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
